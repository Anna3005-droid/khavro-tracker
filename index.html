<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Трекер 8 недель</title>
<meta name="theme-color" content="#0C1330">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Трекер 8 недель">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Onest:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="design.css">
<link rel="stylesheet" href="practice.css">
<link rel="stylesheet" href="help.css">
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="sheet">
    <div class="top"><span>Т Х</span><span>8 недель</span></div>

    <!-- Большой заголовок: только на экране входа -->
    <header class="hero" id="hero">
      <p class="by">Психология финансового масштаба</p>
      <h1>Трекер программы <em>на 8 недель</em></h1>
      <p class="lead">Восемь модулей, восемь встреч с Татьяной и восемь групповых терапий. Здесь вы отмечаете, что сделали, что поняли и как меняются ваши деньги.</p>
    </header>

    <!-- Компактная шапка после входа -->
    <header class="apphead" id="apphead" hidden>
      <div class="ah-text">
        <p class="by">Психология финансового масштаба</p>
        <h1 class="ah-title" id="ah-title"></h1>
        <p class="ah-sub" id="ah-sub"></p>
      </div>
      <div class="ring big" id="ah-ring" role="img"></div>
    </header>

    <div class="orn" aria-hidden="true"><span>✦</span></div>

    <p class="loading" id="loading">Загружаем трекер…</p>

    <!-- Вход и регистрация -->
    <section id="auth" hidden>
      <div class="auth">
        <div class="switch" role="tablist">
          <button class="tab" type="button" role="tab" id="a-login" aria-selected="true">Вход</button>
          <button class="tab" type="button" role="tab" id="a-signup" aria-selected="false">Регистрация</button>
        </div>
        <form id="auth-form" class="auth" novalidate>
          <label class="f" for="a-name" id="a-name-wrap" hidden>Как вас зовут<input type="text" id="a-name" autocomplete="name" placeholder="Имя и фамилия"></label>
          <label class="f" for="a-tg" id="a-tg-wrap" hidden>Ваш ник в Telegram<input type="text" id="a-tg" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="@nickname"><small class="hint">Через него куратор свяжется с вами, если понадобится помощь</small></label>
          <label class="f" for="a-email">Email<input type="email" id="a-email" autocomplete="email" inputmode="email" required></label>
          <label class="f" for="a-pass" id="a-pass-wrap">Пароль<input type="password" id="a-pass" autocomplete="current-password" minlength="6" required></label>
          <button class="btn" type="submit" id="a-submit">Войти</button>
          <button class="link" type="button" id="a-forgot">Забыли пароль?</button>
          <p class="msg" id="a-msg" role="status"></p>
        </form>
      </div>
    </section>

    <!-- Новый пароль после письма о восстановлении -->
    <section id="recover" hidden>
      <form id="rec-form" class="auth" novalidate>
        <h2>Новый пароль</h2>
        <label class="f" for="rec-pass">Придумайте новый пароль, минимум 6 символов<input type="password" id="rec-pass" autocomplete="new-password" minlength="6" required></label>
        <button class="btn" type="submit">Сохранить пароль</button>
        <p class="msg" id="rec-msg" role="status"></p>
      </form>
    </section>

    <!-- Сам трекер -->
    <div id="app" hidden>
      <nav class="tabs" role="tablist" aria-label="Разделы трекера" id="tabs">
        <button class="tab" role="tab" id="t-start" data-tab="start" aria-selected="true">Старт</button>
        <button class="tab" role="tab" id="t-weeks" data-tab="weeks" aria-selected="false">Неделя</button>
        <button class="tab" role="tab" id="t-practice" data-tab="practice" aria-selected="false">Практики</button>
        <button class="tab" role="tab" id="t-total" data-tab="total" aria-selected="false">Итоги</button>
      </nav>
      <main>
        <div id="helpbar"></div>
        <div id="viewbar"></div>
        <div id="alert"></div>
        <section id="start" role="tabpanel" aria-labelledby="t-start"></section>
        <section id="weeks" role="tabpanel" aria-labelledby="t-weeks" hidden></section>
        <section id="practice" role="tabpanel" aria-labelledby="t-practice" hidden></section>
        <section id="total" role="tabpanel" aria-labelledby="t-total" hidden></section>
        <section id="people" role="tabpanel" aria-labelledby="t-people" hidden></section>
      </main>
      <div class="foot">
        <span class="sync" id="sync"><i></i><span id="sync-text"></span></span>
        <span class="foot-actions"><button class="ghost" id="reset" type="button">Очистить мой трекер</button><button class="ghost" type="button" id="logout">Выйти</button></span>
      </div>
      <p class="whoami">Вы вошли как <b id="who-email"></b></p>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Фоновый звук: включается только по нажатию -->
<button class="sound" id="sound" type="button" aria-pressed="false" aria-label="Включить спокойную музыку" title="Спокойная музыка">
  <svg class="sound-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>
  <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="sound.js"></script>
</body>
</html>
